  background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(8,6,3,.55) 100%),

#panel{ position:fixed; left:10px; right:66px; bottom:calc(10px + env(safe-area-inset-bottom,0px)); max-width:420px; max-height:46vh; overflow:auto; background:var(--panel); border:1px solid var(--rule); padding:12px 14px; display:none; z-index:4; }
#panel.på{ display:block; }
#panel h2{ font-family:"IM Fell English",serif; font-weight:400; font-size:22px; margin:0; } #panel .sub{ color:var(--ink-dim); margin:1px 0 8px; }
.handl{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; } .handl button{ background:#3a3024; border:1px solid var(--rule); color:var(--ink); padding:8px 12px; cursor:pointer; } .handl button.på{ background:#3b5878; }
.menn{ display:grid; grid-template-columns:1fr 1fr; gap:3px 10px; font-size:14px; } .menn button{ all:unset; cursor:pointer; padding:2px 4px; border:1px solid transparent; } .menn button.leder{ border-color:var(--hover); color:var(--hover); } .menn span{ color:var(--ink-dim); font-size:12px; display:block; }
.menn button:focus-visible{ outline:2px solid var(--hover); }

// Vis feil på skjermen i stedet for en stille, svart side.
(function () { const vis = t => { const f = document.getElementById('feil'); if (f && f.style.display !== 'block') { f.style.display = 'block'; f.textContent = 'Noe gikk galt: ' + t + ' – prøv å laste siden på nytt (Ctrl+F5).'; } };
  window.addEventListener('error', e => { const t = e.target;   // skrifter som ikke lastes er ufarlige; skript og kode er det ikke
    if (t && t !== window && t.tagName !== 'SCRIPT') return; vis(e.message || 'kunne ikke laste ' + (t && t.src || 'et skript')); }, true);
  window.addEventListener('unhandledrejection', e => vis(e.reason && e.reason.message || String(e.reason))); })();

<script>
'use strict';
// ---------- flisnettet (samme som pipeline/fliser/felles.py) ----------
const DOVRE = [182016, 6880000, 228000, 6930016], DOMBAS = [189000, 6892000, 197000, 6900000];
const DATA = '/dovre-fliser/data/';
const MAKS_M = 4000;   // meter per punkt helt ut (hele Norge)
// Kartfilene ligger i GitHub-releasen KART_TAG og hentes via /api/kart (site/api/kart.js). Svarer ikke den, brukes filene i DATA.
// /norge viser kartet for hele Norge (release fra .github/workflows/norge.yml, ingen filer i repoet), ellers Dovre-piloten.
const HUS_TAG = 'kart-hus-8b5606f3d7b9';
const OMLAND_TAG = 'kart-omland-e1becd1b04bf';   // Sverige, Finland, Danmark, Kola, Svalbard og havet (pipeline/fliser/omland.py), settes av bruk_omland.py
const UTVEG_TAG = 'kart-utveg-b24af84eb3fd';   // jernbane og veger i nabolandene (pipeline/fliser/utveg.py, OpenStreetMap), settes av bruk_utveg.py
const INFRA_TAG = 'kart-infra-2023-7bd50584c2a7';   // bruer, tunneler, ferjer, kraft, olje, tettsteder (pipeline/fliser/infra.py), settes av bruk_infra.py     // byggomriss for hele Norge (OpenStreetMap), settes av pipeline/fliser/bruk_hus.py
const NORGE_TAG = 'kart-norge-2023-382cb2836015';   // settes av pipeline/fliser/bruk_norge.py når en ny Norge-versjon er bygget
const PÅ_NORGE = /^\/norge\/?$/.test(location.pathname);
if (PÅ_NORGE && !NORGE_TAG) location.replace('/kommuner-1986');   // til Norge-kartet er bygget: det gamle kommunekartet
const ER_NORGE = PÅ_NORGE && !!NORGE_TAG;
const KART_TAG_DOVRE = 'kart-26ddc7a5babc';   // settes av pipeline/fliser/versjon.py
const KART_TAG = ER_NORGE ? NORGE_TAG : KART_TAG_DOVRE;
const ZMIN = 0, ZMAX = 17;
// Kroker for spillmodulene i spill/ (docs/plan-funksjoner.md): kartet og spillet kan utvikles hver for seg.
// bygg3d: async (u, { px, TW, skog }) mens 3D-utsnittet bygges; sett3d: (u, R3) når det vises; ramme3d: (R3, dt) hver ramme i 3D
const KROKER = { sikt: [], trykk3d: [], innsyn: [], skjul: [], kanOrdre: [], tegn: [], sim: [], trykk: [], tegn3d: [], ild: [], lagTekst: [], lagKnapper: [], info: [], ser: [], tåke: [], ødelagt: [], bygg3d: [], sett3d: [], ramme3d: [] };   // ødelagt: (objekt, 'ødelegg'|'reparer') når ingeniørene er ferdige (S5)   // ser: fiende => true når noe annet enn lagene ser den (S6 drone/radar); tåke: (g) tegner hull i tåka (meter: X, Y -> skjerm via vx0, vy1)   // lagKnapper: (lag, H) => knapper i lagpanelet; info: (objekt, H) => knapper i infrastrukturpanelet (S5)   // ild: (skytter, mål) => faktor 0–1 (S4 ammunisjon); lagTekst: lag => tekst i panelet   // tegn3d: (g, proj3, mPer3) i 3D-overlegget

// ---------- henting med telling av byte ----------
const STAT = { byte: 0, req: 0, kilde: '' };
// Spør mellomstasjonen én gang ved oppstart etter manifestet (hvilke filer som har hvilke fliser). Svarer den ikke, brukes DATA.
const MANIFEST_RELEASE = !KART_TAG ? Promise.resolve(null) : fetch(`/api/kart/${KART_TAG}/manifest.json/0/1048576`)
  .then(r => r.ok ? r.json() : null).catch(() => null);
const RELEASE = MANIFEST_RELEASE.then(m => !!m);
// Kartflisene (kartflis.js) får vite hvor filene ligger og melder bytene og feilene tilbake hit.
KF.kartTag = KART_TAG; KF.release = RELEASE; KF.data = DATA;
KF.vedBytes = (n, kilde) => { STAT.byte += n; STAT.req++; if (kilde) STAT.kilde = kilde; tegnHud(); };
KF.vedFeil = e => { console.error(e); visFeil(e); };
// Lagene kan være delt i flere filer (hele Norge: sammen.py), hver med zoomområde og eventuelt en stripe av z6-kolonner.
let OMRÅDE = DOVRE, LAGFILER = null, ÅRSTALL = 1987, NORGE_BLOKKER = null, KLAR_FERDIG = false;
const KLAR = (async () => {
  let m = await MANIFEST_RELEASE;
  if (!m) { try { m = await (await fetch(DATA + 'manifest.json')).json(); } catch (e) { m = null; } }
  const filer = m && m.filer ? m.filer : Object.fromEntries(['hoyde', 'terreng', 'kart', 'vektor'].map(n => [n, [{ fil: n + '.pmtiles', zmin: 0, zmax: 99, x6: null }]]));
  if (m && m.omrade) { OMRÅDE = m.omrade; if (ER_NORGE) passInn(OMRÅDE); }   // /norge åpner med hele landet
  if (m && m.år >= 2017) {   // 2023-kartet: andre kilder (lisensene krever kreditering)
    ÅRSTALL = m.år;
    document.getElementById('kilde').textContent = `Høyde: Kartverket DTM (CC BY 4.0) · Inneholder modifiserte Copernicus Sentinel-data ${m.år} · Arealtype: ESA WorldCover 2021 (CC BY 4.0) · Veg: NVDB per 1. juni ${m.år} · Bygg: matrikkelen`;
    loggLinjer.length = 0; logg(`Dovre, sommeren ${m.år}. En fiendtlig patrulje er i området. Du ser bare det dine lag ser – resten ligger i tåke. Trykk på et lag for å gi ordre.`);
  }
  if (HUS_TAG) {   // byggomriss fra egen release; mangler den, brukes byggpunktene i vektorlaget
    try { const r = await fetch(`/api/kart/${HUS_TAG}/manifest.json/0/1048576`);
      if (r.ok) { const mh = await r.json(); filer.hus = mh.filer.hus.map(f => Object.assign({}, f, { tag: HUS_TAG }));
        document.getElementById('kilde').textContent += ' · Byggomriss: © OpenStreetMap-bidragsytere (ODbL)'; } } catch (e) { /* uten omriss */ }
  }
  if (OMLAND_TAG && ER_NORGE) {   // omlandet: kartet glir over i det mot kanten av Norge-blokkene
    try { const r = await fetch(`/api/kart/${OMLAND_TAG}/manifest.json/0/1048576`);
      if (r.ok) { const mo = await r.json(); for (const n of ['ohoyde', 'okart']) filer[n] = mo.filer[n].map(f => Object.assign({}, f, { tag: OMLAND_TAG }));
        NORGE_BLOKKER = new Set(mo.norge_blokker.map(([x, y]) => x + ',' + y));
        document.getElementById('kilde').textContent += ' · Utenfor Norge: Copernicus DEM GLO-90 og ESA WorldCover'; lastVest(); } } catch (e) { /* uten omland */ }
  }
  if (UTVEG_TAG) {   // jernbane (hele Norden) og veger i nabolandene
    try { const r = await fetch(`/api/kart/${UTVEG_TAG}/manifest.json/0/1048576`);
      if (r.ok) { const mu = await r.json(); filer.utveg = mu.filer.utveg.map(f => Object.assign({}, f, { tag: UTVEG_TAG }));
        const k = document.getElementById('kilde'); if (!k.textContent.includes('OpenStreetMap')) k.textContent += ' · Jernbane og utenlandske veger: © OpenStreetMap-bidragsytere (ODbL)'; else k.textContent += ' · Jernbane og veger i nabolandene fra OpenStreetMap'; } } catch (e) { /* uten */ }
  }
  LAGFILER = {};
  for (const [n, liste] of Object.entries(filer)) LAGFILER[n] = liste.map(f => Object.assign({}, f, { pm: new pmtiles.PMTiles(new Kilde(f.fil, f.tag)) }));
  KF.lagfiler = LAGFILER; KF.norgeBlokker = NORGE_BLOKKER;
  startArbeider(filer, await RELEASE);   // bakgrunnstråden lager kartflisene fra nå av (der nettleseren kan)
  if (!ARB) for (const liste of Object.values(LAGFILER)) for (const f of liste) f.pm.getHeader().catch(() => {});   // innholdsfortegnelsene hentes med en gang, samtidig
  KLAR_FERDIG = true;
  skitten = true;
})();
KF.klar = KLAR;
KLAR.then(hentInfra);

const VIS = { skygge: true, koter: true, traer: true, veg: true, bane: true, bygg: true, infra: true, sikt: true, taake: true };
KF.vis = VIS;
// Landene vest for flisnettet (Storbritannia, Shetland, Irland, Færøyene, Island) som ett grovt bilde (pipeline/fliser/vest.py).
const VEST = { b: [-1300000, 5650000, -200000, 8000000], bilde: null };
function lastVest() { const im = new Image(); im.onload = () => { VEST.bilde = im; skitten = true; }; im.src = '/dovre-fliser/data/vest.webp'; }
function tegnVest(vx0, vy1) {
  const im = VEST.bilde; if (!im) return;
  const [a, b, c, d] = VEST.b, m = kam.m, vx1 = vx0 + VW * m, vy0 = vy1 - VH * m;
  const x0 = Math.max(a, vx0), x1 = Math.min(c, vx1), y0 = Math.max(b, vy0), y1 = Math.min(d, vy1); if (x0 >= x1 || y0 >= y1) return;
  const kx = im.naturalWidth / (c - a), ky = im.naturalHeight / (d - b);   // bare den synlige delen av bildet
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(im, (x0 - a) * kx, (d - y1) * ky, (x1 - x0) * kx, (y1 - y0) * ky, (x0 - vx0) / m, (vy1 - y1) / m, (x1 - x0) / m, (y1 - y0) / m);
}
// ---------- bakgrunnstråd for kartflisene (kartflis-arbeider.js) ----------
// Komponeringen (dekoding, høyde, skygge, vann, trær, hus …) er tung og gjorde draing og zooming hakkete. Tråden lager
// flisene og sender ferdige bilder tilbake; siden tegner bare. Uten OffscreenCanvas (eldre Safari) lages de her som før.
let ARB = null, arbId = 0; const ARB_VENT = new Map();
function startArbeider(filer, release) {
  if (!HAR_OFFSCREEN || typeof Worker === 'undefined') return;
  try {
    const w = new Worker('/dovre-fliser/kartflis-arbeider.js?v=1f95e037d8');
    w.onmessage = ({ data: m }) => {
      if (m.type === 'bytes') { STAT.byte += m.n; STAT.req += m.req; if (m.kilde) STAT.kilde = m.kilde; tegnHud(); return; }
      if (m.type === 'feil') { visFeil(new Error(m.melding)); return; }
      const v = ARB_VENT.get(m.id); if (!v) return; ARB_VENT.delete(m.id);
      if (m.feil) v.nei(new Error(m.feil)); else v.ok({ c: m.bm, E: m.E });
    };
    w.onerror = e => { e.preventDefault(); console.error('kartflis-arbeider:', e.message); ARB = null;   // videre lages flisene her
      for (const v of ARB_VENT.values()) v.ok(null); ARB_VENT.clear(); skitten = true; };
    w.postMessage({ type: 'init', kartTag: KART_TAG, release, data: DATA, vis: { ...VIS },
      norgeBlokker: NORGE_BLOKKER ? [...NORGE_BLOKKER] : null,
      filer: Object.fromEntries(Object.entries(filer).map(([n, l]) => [n, l.map(f => ({ fil: f.fil, tag: f.tag || null, zmin: f.zmin, zmax: f.zmax, x6: f.x6 || null }))])) });
    ARB = w;
  } catch (e) { ARB = null; }
}
// En ferdig flis { c: bilde, E: høyder } – fra tråden når den finnes, ellers lages den her.
function lagFlis(z, x, y, valg = VIS) {
  if (!ARB) return komponer(z, x, y, valg);
  return new Promise((ok, nei) => { const id = ++arbId; ARB_VENT.set(id, { ok, nei }); ARB.postMessage({ type: 'flis', id, z, x, y, valg: { ...valg } }); })
    .then(t => t || komponer(z, x, y, valg));   // tråden stoppet underveis: lag den her
}
function forhent(z, x, y) { if (ARB) ARB.postMessage({ type: 'hent', z, x, y, valg: { ...VIS } }); else flisData(z, x, y).catch(() => {}); }

// ---------- kamera og tegning ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let dpr = 1, VW = 0, VH = 0;
const kam = { x: 0, y: 0, m: 30 }; // sentrum (m), meter per CSS-piksel
const FERDIG = new Map(), VENTER = new Set(); let aktive = 0, skitten = true;
function niva() { return Math.max(ZMIN, Math.min(ZMAX, Math.round(Math.log2(G.res0 / (kam.m / dpr))))); }
function storrelse() { dpr = Math.min(2, window.devicePixelRatio || 1); VW = cv.clientWidth; VH = cv.clientHeight; cv.width = VW * dpr; cv.height = VH * dpr; skitten = true;
  document.documentElement.style.setProperty('--topp', document.querySelector('.top').getBoundingClientRect().bottom + 'px'); }
function passInn(b) { kam.x = (b[0] + b[2]) / 2; kam.y = (b[1] + b[3]) / 2; kam.m = Math.max((b[2] - b[0]) / VW, (b[3] - b[1]) / (VH - 80)) * 1.05; skitten = true; }
const HENTET = new Set();   // fliser vi allerede har bedt om data til
function kø(z, x, y, k) {
  if (!HENTET.has(k) && KLAR_FERDIG) { HENTET.add(k); if (HENTET.size > 2000) HENTET.delete(HENTET.keys().next().value); forhent(z, x, y); }   // nettet jobber mens køen venter
  if (VENTER.has(k) || aktive >= 6) return;
  VENTER.add(k); aktive++;
  lagFlis(z, x, y).then(t => { FERDIG.set(k, t); if (FERDIG.size > 320) { const [gk, gt] = FERDIG.entries().next().value; FERDIG.delete(gk); if (gt.c.close) gt.c.close(); } })
    .catch(e => { console.error(e); visFeil(e); })
    .finally(() => { VENTER.delete(k); aktive--; skitten = true; });
}
function tegn() {

})();

function zoom(fak, cx = VW / 2, cy = VH / 2) {
  const X = kam.x + (cx - VW / 2) * kam.m, Y = kam.y - (cy - VH / 2) * kam.m;
  kam.m = Math.max(0.1, Math.min(MAKS_M, kam.m / fak));

}

    if (pinch) { zoom(d / pinch.d, mx, my); kam.x -= (mx - pinch.mx) * kam.m; kam.y += (my - pinch.my) * kam.m; }
    pinch = { d, mx, my };
  } else if (ptr.size === 1) { kam.x -= (e.clientX - forrige[0]) * kam.m; kam.y += (e.clientY - forrige[1]) * kam.m; skitten = true; }
});
