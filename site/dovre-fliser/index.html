<script>
// Meldingsboksen midt på skjermen: tekst, lukkeknapp og eventuelt en knapp som gjør noe (12. nov: boksen ble stående for alltid).
// type sier hva meldingen gjelder, så den kan tas bort når akkurat det virker igjen: skjulMelding('nett') når kartdata kommer inn,
// skjulMelding('3d') når 3D-utsnittet er bygget. Lukker spilleren en melding, vises ikke den samme teksten igjen før etter et minutt.
const MELDING = { type: null, lukket: {} };
function visMelding(tekst, valg) {
  const f = document.getElementById('feil'), v = valg || {}; if (!f) return;
  if (MELDING.lukket[tekst] && performance.now() - MELDING.lukket[tekst] < 60000) return;
  MELDING.type = v.type || 'feil'; MELDING.tekst = tekst; document.getElementById('feilTekst').textContent = tekst;
  const k = document.getElementById('feilKnapp'); k.hidden = !v.knapp; k.textContent = v.knapp || ''; k.onclick = v.vedTrykk ? () => { skjulMelding(); v.vedTrykk(); } : null;
  document.getElementById('feilLukk').onclick = () => { MELDING.lukket[tekst] = performance.now(); skjulMelding(); };
  f.style.display = 'block';
}
function skjulMelding(type) {
  const f = document.getElementById('feil'); if (!f || (type && MELDING.type !== type)) return;
  f.style.display = 'none'; MELDING.type = null;
}
// Vis feil på skjermen i stedet for en stille, svart side.
(function () { const vis = t => { const f = document.getElementById('feil'); if (f && f.style.display !== 'block') visMelding('Noe gikk galt: ' + t + ' – prøv å laste siden på nytt (Ctrl+F5).'); };
  // Skript som en nettleserutvidelse eller et annet program på maskinen setter inn i siden, er ikke spillets: spillet henter ingenting
  // fra andre nettsteder (14. nov: brukeren fikk «kunne ikke laste https://static-lib.com/…/vendor.min.js»). Feil i slike skript meldes
  // ikke som spillets; nettstedene huskes i FREMMEDE, og nevnes hvis kartdataene ikke lar seg hente (visFeil).
  window.FREMMEDE = new Set();
  const vår = u => { try { return !u || new URL(u, location.href).origin === location.origin; } catch (x) { return true; } };
  const fremmed = u => { try { FREMMEDE.add(new URL(u, location.href).hostname); } catch (x) { /* ikke en adresse */ } console.warn('feil i et skript som ikke er spillets:', u); };
  window.addEventListener('error', e => { const t = e.target;   // skrifter som ikke lastes er ufarlige; skript og kode er det ikke
    if (t && t !== window && t.tagName !== 'SCRIPT') return;
    if (t && t !== window) { if (!vår(t.src)) return fremmed(t.src); }
    else if ((e.filename && !vår(e.filename)) || e.message === 'Script error.') return fremmed(e.filename || '');
    vis(e.message || 'kunne ikke laste ' + (t && t.src || 'et skript')); }, true);
  window.addEventListener('unhandledrejection', e => vis(e.reason && e.reason.message || String(e.reason))); })();
</script>

<script>
'use strict';
// ---------- flisnettet (samme som pipeline/fliser/felles.py) ----------
const DOVRE = [182016, 6880000, 228000, 6930016], DOMBAS = [189000, 6892000, 197000, 6900000];
const DATA = '/dovre-fliser/data/';
const MAKS_M = 4000;   // meter per punkt helt ut (hele Norge)
// Kartfilene ligger i GitHub-releasen KART_TAG og hentes via /api/kart (site/api/kart.js). Svarer ikke den, brukes filene i DATA.
// /norge viser kartet for hele Norge (release fra .github/workflows/norge.yml, ingen filer i repoet), ellers Dovre-piloten.
const HUS_TAG = 'kart-hus-8b5606f3d7b9';
const OMLAND_TAG = 'kart-omland-e1becd1b04bf';   // Sverige, Finland, Danmark, Kola, Svalbard og havet (pipeline/fliser/omland.py), settes av bruk_omland.py
const UTVEG_TAG = 'kart-utveg-abb9d613f42a';   // jernbane og veger i nabolandene (pipeline/fliser/utveg.py, OpenStreetMap), settes av bruk_utveg.py
const INFRA_TAG = 'kart-infra-2023-7bd50584c2a7';   // bruer, tunneler, ferjer, kraft, olje, tettsteder (pipeline/fliser/infra.py), settes av bruk_infra.py     // byggomriss for hele Norge (OpenStreetMap), settes av pipeline/fliser/bruk_hus.py
const NORGE_TAG = 'kart-norge-2023-382cb2836015';   // settes av pipeline/fliser/bruk_norge.py når en ny Norge-versjon er bygget
const PÅ_NORGE = /^\/(norge|rogaland)\/?$/.test(location.pathname);
if (PÅ_NORGE && !NORGE_TAG) location.replace('/kommuner-1986');   // til Norge-kartet er bygget: det gamle kommunekartet
const ER_NORGE = PÅ_NORGE && !!NORGE_TAG;
const KART_TAG_DOVRE = 'kart-b461a42bbe67';   // settes av pipeline/fliser/versjon.py
const KART_TAG = ER_NORGE ? NORGE_TAG : KART_TAG_DOVRE;
const ZMIN = 0, ZMAX = 17;
// Kroker for spillmodulene i spill/ (docs/plan-funksjoner.md): kartet og spillet kan utvikles hver for seg.
// bygg3d: async (u, { px, TW, skog }) mens 3D-utsnittet bygges; sett3d: (u, R3) når det vises; ramme3d: (R3, dt) hver ramme i 3D
const KROKER = { siktlys: [], sikt: [], trykk3d: [], innsyn: [], skjul: [], kanOrdre: [], tegn: [], sim: [], trykk: [], tegn3d: [], ild: [], lagTekst: [], lagKnapper: [], info: [], ser: [], tåke: [], ødelagt: [], bygg3d: [], forbered3d: [], sett3d: [], ramme3d: [], bilde3d: [], lys3d: [], bakke: [] };   // ødelagt: (objekt, 'ødelegg'|'reparer') når ingeniørene er ferdige (S5)   // ser: fiende => true når noe annet enn lagene ser den (S6 drone/radar); tåke: (g) tegner hull i tåka (meter: X, Y -> skjerm via vx0, vy1)   // lagKnapper: (lag, H) => knapper i lagpanelet; info: (objekt, H) => knapper i infrastrukturpanelet (S5)   // ild: (skytter, mål) => faktor 0–1 (S4 ammunisjon); lagTekst: lag => tekst i panelet   // tegn3d: (g, proj3, mPer3) i 3D-overlegget

// ---------- henting med telling av byte ----------
const STAT = { byte: 0, req: 0, kilde: '' };
// Spør mellomstasjonen én gang ved oppstart etter manifestet (hvilke filer som har hvilke fliser). Svarer den ikke, brukes DATA.
// Tidsgrense (12. nov): svarte ikke mellomstasjonen, ventet oppstarten for alltid og kartet ble svart uten melding.
const FRIST_MANIFEST = 8000;
const hentManifest = tag => hentMedFrist(`/api/kart/${tag}/manifest.json/0/1048576`, FRIST_MANIFEST, 'json').then(s => s.data).catch(() => null);
const MANIFEST_RELEASE = !KART_TAG ? Promise.resolve(null) : hentManifest(KART_TAG);
// de andre manifestene spørres det etter samtidig (før: ett om gangen), så et kartlager som ikke svarer koster én tidsgrense, ikke fire
const MANIFEST_HUS = HUS_TAG ? hentManifest(HUS_TAG) : null, MANIFEST_OMLAND = OMLAND_TAG && ER_NORGE ? hentManifest(OMLAND_TAG) : null, MANIFEST_UTVEG = UTVEG_TAG ? hentManifest(UTVEG_TAG) : null;
const RELEASE = MANIFEST_RELEASE.then(m => !!m);
// Riksgrensa (data/riksgrense.json, Kartverket): /norge toner Norge-kartet over i omlandet ved grensa, og leiren kan ikke legges i utlandet.
// Hentes samtidig med manifestene. Uten den virker alt som før (kartet tones bare mot blokkantene, leirvalget sjekker ikke grensa).
let RIKSGRENSE = null;
const RIKSGRENSE_DATA = ER_NORGE ? hentMedFrist(DATA + 'riksgrense.json', FRIST_MANIFEST, 'json').then(s => s.data).catch(() => null) : Promise.resolve(null);
// Kartflisene (kartflis.js) får vite hvor filene ligger og melder bytene og feilene tilbake hit.
KF.kartTag = KART_TAG; KF.release = RELEASE; KF.data = DATA;
KF.vedBytes = (n, kilde) => { STAT.byte += n; STAT.req++; if (kilde) STAT.kilde = kilde; tegnHud(); nettOk(); };
KF.vedFeil = e => { console.error(e); visFeil(e); };
// Lagene kan være delt i flere filer (hele Norge: sammen.py), hver med zoomområde og eventuelt en stripe av z6-kolonner.
let OMRÅDE = DOVRE, LAGFILER = null, ÅRSTALL = 1987, NORGE_BLOKKER = null, KLAR_FERDIG = false;
const KLAR = (async () => {
  let m = await MANIFEST_RELEASE; const mangler = [], fraLageret = !!m;
  if (!m) { try { m = (await hentMedFrist(DATA + 'manifest.json', FRIST_MANIFEST, 'json')).data; } catch (e) { m = null; }
    if (ER_NORGE) norgeMangler(); }
  const filer = m && m.filer ? m.filer : Object.fromEntries(['hoyde', 'terreng', 'kart', 'vektor'].map(n => [n, [{ fil: n + '.pmtiles', zmin: 0, zmax: 99, x6: null }]]));
  // (runde 8, pakke «utseende») et lagret spill har alt lagt kartet over leiren (oppstart-visning.js, «Velkommen tilbake»); kom manifestet
  // etterpå, ble kartet flyttet tilbake til hele landet – og flisene for hele landet ble laget før leirens (blått kart de første sekundene)
  const lagretLeir = !navigator.webdriver && !/[#&?](x|kart|pos)=/.test(location.href) && window.OppstartSpill && OppstartSpill.tilstand() && OppstartSpill.tilstand().leir;
  if (m && m.omrade) { OMRÅDE = m.omrade; if (ER_NORGE && !(lagretLeir && kam.m <= 8)) passInnHele('åpning'); }
  // (et mindre spillkart – /rogaland – åpner på sitt eget område, se passInnHele)   // /norge åpner med hele landet (telefon: Sør-Norge)
  if (m && m.år >= 2017) {   // 2023-kartet: andre kilder (lisensene krever kreditering)
    ÅRSTALL = m.år;
    document.getElementById('kilde').textContent = `Høyde: Kartverket DTM (CC BY 4.0) · Inneholder modifiserte Copernicus Sentinel-data ${m.år} · Arealtype: ESA WorldCover 2021 (CC BY 4.0) · Veg: NVDB per 1. juni ${m.år} · Bygg: matrikkelen`;
  }
  if (HUS_TAG) {   // byggomriss fra egen release; mangler den, brukes byggpunktene i vektorlaget
    try { const mh = await MANIFEST_HUS;
      if (mh) { filer.hus = mh.filer.hus.map(f => Object.assign({}, f, { tag: HUS_TAG }));
        document.getElementById('kilde').textContent += ' · Byggomriss: © OpenStreetMap-bidragsytere (ODbL)'; } else mangler.push('byggene'); } catch (e) { mangler.push('byggene'); }
  }
  if (OMLAND_TAG && ER_NORGE && fraLageret) {   // omlandet: kartet glir over i det mot kanten av Norge-blokkene (ikke rundt Dovre-reserven)
    try { const mo = await MANIFEST_OMLAND;
      if (!mo) mangler.push('nabolandene');
      if (mo) { for (const n of ['ohoyde', 'okart']) filer[n] = mo.filer[n].map(f => Object.assign({}, f, { tag: OMLAND_TAG }));
        NORGE_BLOKKER = new Set(mo.norge_blokker.map(([x, y]) => x + ',' + y));
        document.getElementById('kilde').textContent += ' · Utenfor Norge: Copernicus DEM GLO-90 og ESA WorldCover'; lastVest(); } } catch (e) { mangler.push('nabolandene'); }
  }
  if (UTVEG_TAG) {   // jernbane (hele Norden) og veger i nabolandene
