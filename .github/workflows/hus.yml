# Byggomriss for hele Norge fra OpenStreetMap (© OpenStreetMap-bidragsytere, ODbL) -> release kart-hus-<hash>.
# Egen jobb, så byggene kan oppdateres uten å bygge hele kartet på nytt. Tas i bruk med pipeline/fliser/bruk_hus.py.
name: Bygg byggomriss
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: hus, cancel-in-progress: false }
jobs:
  hus:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - run: pip install -q -r pipeline/fliser/krav.txt osmium
      - name: Last ned Norge fra OpenStreetMap
        run: |
          curl -fL --retry 5 -o norge.osm.pbf https://download.geofabrik.de/europe/norway-latest.osm.pbf \
            || curl -fL --retry 5 -o norge.osm.pbf https://download.openstreetmap.fr/extracts/europe/norway-latest.osm.pbf
          ls -la norge.osm.pbf
      - name: Byggene og anleggene (med nodene de trenger), og butikkpunktene for seg
        run: |
          osmium tags-filter -R norge.osm.pbf n/shop n/amenity=fuel,pharmacy,fast_food,restaurant,cafe,marketplace -o punkt.osm.pbf
          osmium tags-filter norge.osm.pbf w/building r/building w/leisure=pitch,track,playground r/leisure=pitch w/amenity=parking r/amenity=parking w/aeroway=runway,taxiway,apron r/aeroway=apron w/amenity=fuel -o bygg.osm.pbf
          rm norge.osm.pbf && ls -la bygg.osm.pbf punkt.osm.pbf
      - name: Lag fliser
        working-directory: pipeline/fliser
        run: python3 bygninger.py ../../bygg.osm.pbf ../../hus ../../punkt.osm.pbf
      - name: Last opp release
        env: { GH_TOKEN: '${{ github.token }}' }
        working-directory: hus
        run: |
          TAG=$(cat tag.txt)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --latest=false --title "Byggomriss $TAG" \
            --notes "Byggomriss for hele Norge fra OpenStreetMap (© OpenStreetMap-bidragsytere, ODbL). Lages av .github/workflows/hus.yml."
          gh release upload "$TAG" hus-*.pmtiles manifest.json --clobber
          echo "### Ferdig: $TAG" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import json;m=json.load(open('manifest.json'));print(json.dumps(m['statistikk']), m['filer']['hus'][0]['byte'])" >> "$GITHUB_STEP_SUMMARY"
